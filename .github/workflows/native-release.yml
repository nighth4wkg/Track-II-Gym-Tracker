name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in v1.2.3 format
        required: true

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source and release metadata
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for release browser checks
        run: npx playwright install --with-deps chromium

      - name: Require package version and release notes to match
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v1.2.3 format."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG must equal package.json version $EXPECTED_TAG."
            exit 1
          fi
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Missing release notes: $NOTES_FILE"
            exit 1
          fi
          grep -Eq "^# Track II ${RELEASE_TAG}([[:space:]]|$)" "$NOTES_FILE"

      - name: Run the complete release validation
        run: npm run validate:release

  android:
    name: Android test APK
    needs: validate
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_TRACK_VERSION: ${{ inputs.tag }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TRACK_WEB_ORIGIN: ${{ vars.TRACK_WEB_ORIGIN }}
      NEXT_PUBLIC_TRACK_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
      NEXT_PUBLIC_TRACK_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pages

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android package version
        working-directory: android
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -q "versionName \"${VERSION_NAME}\"" app/build.gradle

      - name: Generate Android app icons
        run: npm run generate:native-icons

      - name: Build debug-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage Android artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Track-II-android-test.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-ii-android
          path: release-assets/Track-II-android-test.apk
          if-no-files-found: error

  ios:
    name: Unsigned iOS IPA
    needs: validate
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NEXT_PUBLIC_TRACK_VERSION: ${{ inputs.tag }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TRACK_WEB_ORIGIN: ${{ vars.TRACK_WEB_ORIGIN }}
      NEXT_PUBLIC_TRACK_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
      NEXT_PUBLIC_TRACK_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pages

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Generate iOS app icons
        run: npm run generate:native-icons

      - name: Build unsigned iOS app
        run: |
          APP_VERSION="${RELEASE_TAG#v}"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload release-assets
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload release-assets/Track-II-ios-unsigned.ipa

      - name: Generate SideStore source
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APP_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$APP_PATH/Info.plist")"
          MIN_IOS="$(plutil -extract MinimumOSVersion raw -o - "$APP_PATH/Info.plist")"
          npm run generate:sidestore-source -- \
            --ipa release-assets/Track-II-ios-unsigned.ipa \
            --output release-assets/altstore-source.json \
            --version "$APP_VERSION" \
            --bundle-id "$BUNDLE_ID" \
            --min-ios "$MIN_IOS" \
            --date "$(date -u +%F)" \
            --release-tag "$RELEASE_TAG" \
            --repository-url "$REPOSITORY_URL" \
            --repository-slug "$REPOSITORY_SLUG"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-ii-ios
          path: |
            release-assets/Track-II-ios-unsigned.ipa
            release-assets/altstore-source.json
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v1.2.3 format."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: track-ii-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        run: |
          NOTES_FILE="release-notes/v${RELEASE_TAG#v}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "Missing release notes: $NOTES_FILE"
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "Track II $RELEASE_TAG" \
            --notes-file "$NOTES_FILE"
