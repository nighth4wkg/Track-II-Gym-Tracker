name: Native Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in v1.2.3 format
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  android:
    name: Android test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pages

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug-signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Stage Android artifact
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/Track-II-android-test.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: track-ii-android
          path: release-assets/Track-II-android-test.apk
          if-no-files-found: error

  ios:
    name: Unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build:pages

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p Payload release-assets
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload release-assets/Track-II-ios-unsigned.ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: track-ii-ios
          path: release-assets/Track-II-ios-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v1.2.3 format."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: track-ii-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "Track II $RELEASE_TAG" \
            --notes-file release-notes/v1.0.md
