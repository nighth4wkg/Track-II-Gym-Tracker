name: Validate protected staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  authenticated-e2e:
    name: Authenticated staging browser tests
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_REQUIRE_AUTH: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for authenticated browser coverage
        run: npx playwright install --with-deps chromium

      - name: Require protected staging secrets
        run: |
          test -n "$E2E_BASE_URL"
          test -n "$E2E_USERNAME"
          test -n "$E2E_PASSWORD"

      - name: Run authenticated browser tests
        run: npm run test:e2e:built
