name: Native Production Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in v1.2.3 format
        required: true
      publish_testflight:
        description: Upload the signed IPA to TestFlight after the build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-production-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  NEXT_PUBLIC_TRACK_VERSION: ${{ inputs.tag }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_TRACK_WEB_ORIGIN: ${{ vars.TRACK_WEB_ORIGIN }}
  NEXT_PUBLIC_TRACK_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
  NEXT_PUBLIC_TRACK_ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues

jobs:
  validate:
    name: Validate source and release metadata
    runs-on: ubuntu-latest
    environment: production
    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      PAGES_VERIFY_URL: ${{ vars.TRACK_WEB_ORIGIN }}
      PAGES_VERIFY_REQUIRE_BROTLI: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require package version and release notes to match
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use v1.2.3 format."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "$RELEASE_TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $RELEASE_TAG must equal package.json version $EXPECTED_TAG."
            exit 1
          fi
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          test -f "$NOTES_FILE"
          grep -Eq "^# Track II ${RELEASE_TAG}([[:space:]]|$)" "$NOTES_FILE"

      - name: Run complete release validation
        run: |
          test -n "$E2E_USERNAME"
          test -n "$E2E_PASSWORD"
          test -n "$PAGES_VERIFY_URL"
          npm run validate:production

  android:
    name: Signed Android APK and AAB
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/track-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and native project
        run: |
          npm run build:pages
          npx cap add android
          npx cap sync android
          npm run generate:native-icons

      - name: Set Android release version
        working-directory: android
        shell: bash
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" app/build.gradle
          grep -q "versionName \"${VERSION_NAME}\"" app/build.gradle

      - name: Install Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - name: Configure release signing
        run: node scripts/configure-android-signing.mjs

      - name: Build signed Android artifacts
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Stage Android artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/Track-II-android-${RELEASE_TAG}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/Track-II-android-${RELEASE_TAG}.apk"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-ii-android-production
          path: release-assets/*
          if-no-files-found: error

  ios:
    name: Signed iOS IPA
    needs: validate
    runs-on: macos-15
    environment: production
    env:
      IOS_KEYCHAIN_PATH: ${{ runner.temp }}/track-release.keychain-db
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_BUNDLE_ID: com.track.lifting
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and native project
        run: |
          npm run build:pages
          npx cap add ios
          npx cap sync ios
          npm run generate:native-icons

      - name: Install Apple signing assets
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$IOS_KEYCHAIN_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$IOS_KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$IOS_KEYCHAIN_PATH"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/track-distribution.p12"
          security import "$RUNNER_TEMP/track-distribution.p12" -k "$IOS_KEYCHAIN_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -d user -s "$IOS_KEYCHAIN_PATH"
          security default-keychain -s "$IOS_KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/track.mobileprovision"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/track.mobileprovision" | plutil -extract UUID raw -o - -)"
          cp "$RUNNER_TEMP/track.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          PROFILE_NAME="$(security cms -D -i "$RUNNER_TEMP/track.mobileprovision" | plutil -extract Name raw -o - -)"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Archive signed iOS app
        shell: bash
        run: |
          APP_VERSION="${RELEASE_TAG#v}"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Track-II.xcarchive" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID"

      - name: Export signed IPA
        shell: bash
        env:
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/track-export" release-assets
          if [[ -n "${IOS_EXPORT_OPTIONS_PLIST_BASE64:-}" ]]; then
            echo "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"
          else
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          <key>provisioningProfiles</key><dict><key>${IOS_BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict></plist>
          PLIST
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Track-II.xcarchive" \
            -exportPath "$RUNNER_TEMP/track-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA_PATH="$(find "$RUNNER_TEMP/track-export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          cp "$IPA_PATH" "release-assets/Track-II-ios-${RELEASE_TAG}.ipa"

      - name: Upload signed IPA to TestFlight
        if: ${{ inputs.publish_testflight == true }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcrun iTMSTransporter -m upload \
            -assetFile "release-assets/Track-II-ios-${RELEASE_TAG}.ipa" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: track-ii-ios-production
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish signed native release
    needs: [validate, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download signed native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: track-ii-*-production
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        run: |
          NOTES_FILE="release-notes/${RELEASE_TAG}.md"
          test -f "$NOTES_FILE"
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "Track II $RELEASE_TAG" \
            --notes-file "$NOTES_FILE"
